<title>볼 머신</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gothic+A1:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600;700&display=swap">
<style>
  :root{
    --bg:#f5f1e6;
    --surface:#fffdf7;
    --surface-2:#efe8d4;
    --ink:#221f18;
    --ink-soft:#77715e;
    --line:#ddd2b6;
    --accent:#1f7a4d;
    --accent-strong:#155c39;
    --accent-ink:#f6f2e6;
    --shadow: 0 20px 44px -22px rgba(34,31,24,.4);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#11181a;
      --surface:#1b2422;
      --surface-2:#223029;
      --ink:#ece7da;
      --ink-soft:#94a39a;
      --line:#2c3835;
      --accent:#4fae7c;
      --accent-strong:#6ec898;
      --accent-ink:#0c1412;
      --shadow: 0 20px 44px -18px rgba(0,0,0,.65);
    }
  }
  :root[data-theme="dark"]{
    --bg:#11181a;
    --surface:#1b2422;
    --surface-2:#223029;
    --ink:#ece7da;
    --ink-soft:#94a39a;
    --line:#2c3835;
    --accent:#4fae7c;
    --accent-strong:#6ec898;
    --accent-ink:#0c1412;
    --shadow: 0 20px 44px -18px rgba(0,0,0,.65);
  }

  /* real ball colors used by the Korean Lotto 6/45 draw */
  :root{
    --ball-yellow:#fbc400;
    --ball-blue:#69c8f2;
    --ball-red:#ff7272;
    --ball-gray:#aaaaaa;
    --ball-green:#b0d840;
    --ball-ink:#241f10;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100dvh;
    background:
      radial-gradient(circle at 50% -8%, color-mix(in srgb, var(--accent) 12%, var(--bg)) 0%, var(--bg) 55%);
    color:var(--ink);
    font-family:"Gothic A1", -apple-system, "Malgun Gothic", sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .page{
    max-width:460px;
    margin-inline:auto;
    padding-inline:20px;
    padding-block:40px 56px;
    display:flex;
    flex-direction:column;
    gap:26px;
  }

  .masthead{display:flex;flex-direction:column;gap:8px;}
  .eyebrow{
    margin:0;
    font-family:"IBM Plex Mono", monospace;
    font-size:.72rem;
    font-weight:600;
    letter-spacing:.18em;
    color:var(--accent-strong);
    text-transform:uppercase;
  }
  h1{
    margin:0;
    font-family:"Black Han Sans", "Gothic A1", sans-serif;
    font-size:clamp(2rem, 7vw, 2.6rem);
    line-height:1.05;
    text-wrap:balance;
    letter-spacing:.01em;
  }
  .lede{
    margin:0;
    max-width:46ch;
    font-size:.94rem;
    line-height:1.6;
    color:var(--ink-soft);
  }

  .ticket{
    position:relative;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:20px;
    box-shadow:var(--shadow);
    overflow:hidden;
  }
  .ticket-head{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
    padding:20px 20px 16px;
    border-bottom:2px dashed var(--line);
  }
  .wordmark{
    font-family:"Black Han Sans", sans-serif;
    font-size:1.3rem;
    letter-spacing:.02em;
  }
  .wordmark span{color:var(--accent);}
  .ticket-meta{
    display:flex;
    gap:16px;
    margin:0;
  }
  .ticket-meta div{display:flex;flex-direction:column;gap:2px;}
  .ticket-meta dt{
    margin:0;
    font-size:.62rem;
    letter-spacing:.1em;
    color:var(--ink-soft);
    text-transform:uppercase;
  }
  .ticket-meta dd{
    margin:0;
    font-family:"IBM Plex Mono", monospace;
    font-weight:600;
    font-size:.82rem;
    font-variant-numeric:tabular-nums;
  }

  .rows{display:flex;flex-direction:column;}
  .row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 20px;
    flex-wrap:wrap;
  }
  .row + .row{border-top:1px dashed var(--line);}
  .row-label{
    flex:none;
    width:22px;
    height:22px;
    border-radius:7px;
    background:var(--surface-2);
    color:var(--ink-soft);
    font-family:"IBM Plex Mono", monospace;
    font-weight:700;
    font-size:.72rem;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .balls{
    display:flex;
    align-items:center;
    gap:5px;
    flex-wrap:wrap;
    flex:1 1 auto;
  }
  .plus{
    color:var(--ink-soft);
    font-weight:700;
    font-size:.85rem;
    padding-inline:1px;
  }
  .ball{
    position:relative;
    flex:none;
    width:30px;
    height:30px;
    border-radius:50%;
    border:0;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:"IBM Plex Mono", monospace;
    font-weight:700;
    font-size:.76rem;
    color:var(--ball-ink);
    box-shadow: inset 0 -3px 0 rgba(0,0,0,.14);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .ball:hover{transform:translateY(-2px);}
  .ball:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .ball.is-locked{box-shadow: inset 0 -3px 0 rgba(0,0,0,.14), 0 0 0 3px var(--accent);}
  .ball.is-locked::after{
    content:"🔒";
    position:absolute;
    bottom:-4px;
    right:-4px;
    font-size:9px;
    line-height:1;
  }
  .ball--yellow{background:radial-gradient(circle at 32% 26%, rgba(255,255,255,.75), transparent 55%), var(--ball-yellow);}
  .ball--blue{background:radial-gradient(circle at 32% 26%, rgba(255,255,255,.75), transparent 55%), var(--ball-blue);}
  .ball--red{background:radial-gradient(circle at 32% 26%, rgba(255,255,255,.75), transparent 55%), var(--ball-red);}
  .ball--gray{background:radial-gradient(circle at 32% 26%, rgba(255,255,255,.75), transparent 55%), var(--ball-gray);}
  .ball--green{background:radial-gradient(circle at 32% 26%, rgba(255,255,255,.75), transparent 55%), var(--ball-green);}

  .redraw{
    flex:none;
    margin-left:auto;
    width:28px;
    height:28px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--surface-2);
    color:var(--ink-soft);
    font-size:.95rem;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:color .15s ease, border-color .15s ease, transform .15s ease;
  }
  .redraw:hover{color:var(--accent-strong);border-color:var(--accent);transform:rotate(35deg);}
  .redraw:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  .barcode{
    height:26px;
    margin:6px 20px 0;
    background: repeating-linear-gradient(90deg, var(--ink) 0 2px, transparent 2px 5px, var(--ink) 5px 6px, transparent 6px 10px);
    opacity:.55;
  }
  .ticket-foot{
    display:flex;
    justify-content:space-between;
    padding:8px 20px 18px;
    font-family:"IBM Plex Mono", monospace;
    font-size:.62rem;
    letter-spacing:.08em;
    color:var(--ink-soft);
    text-transform:uppercase;
  }

  .controls{display:flex;flex-direction:column;align-items:center;gap:10px;}
  .draw-all{
    width:100%;
    padding:15px;
    border:0;
    border-radius:14px;
    background:var(--accent);
    color:var(--accent-ink);
    font-family:"Gothic A1", sans-serif;
    font-weight:900;
    font-size:1.02rem;
    letter-spacing:.01em;
    cursor:pointer;
    box-shadow:0 14px 28px -14px color-mix(in srgb, var(--accent) 70%, transparent);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .draw-all:hover{transform:translateY(-1px);}
  .draw-all:active{transform:translateY(1px);}
  .draw-all:focus-visible{outline:2px solid var(--ink);outline-offset:3px;}
  .hint{margin:0;font-size:.78rem;color:var(--ink-soft);text-align:center;}

  .legend{
    list-style:none;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px 16px;
    margin:6px 0 0;
    padding:0;
  }
  .legend li{
    display:flex;
    align-items:center;
    gap:6px;
    font-family:"IBM Plex Mono", monospace;
    font-size:.72rem;
    color:var(--ink-soft);
    font-variant-numeric:tabular-nums;
  }
  .dot{width:10px;height:10px;border-radius:50%;flex:none;}
  .dot--yellow{background:var(--ball-yellow);}
  .dot--blue{background:var(--ball-blue);}
  .dot--red{background:var(--ball-red);}
  .dot--gray{background:var(--ball-gray);}
  .dot--green{background:var(--ball-green);}

  .disclaimer{margin:4px 0 0;}
  .disclaimer p{
    margin:0;
    text-align:center;
    font-size:.7rem;
    line-height:1.6;
    color:var(--ink-soft);
  }

  @keyframes pop{
    0%{transform:scale(.35) rotate(-10deg);opacity:.15;}
    62%{transform:scale(1.14) rotate(4deg);opacity:1;}
    100%{transform:scale(1) rotate(0);}
  }
</style>

<div class="page">
  <header class="masthead">
    <p class="eyebrow">Ball Machine · 1~45</p>
    <h1>볼 머신</h1>
    <p class="lede">45개의 공 중에서 6개와 보너스 1개를 무작위로 뽑아요. 마음에 드는 번호는 눌러서 고정한 뒤 다시 뽑으면 나머지만 바뀝니다.</p>
  </header>

  <main class="ticket" aria-label="가상 로또 용지">
    <div class="ticket-head">
      <div class="wordmark">LOTTO <span>6/45</span></div>
      <dl class="ticket-meta">
        <div><dt>회차</dt><dd id="roundNum">—</dd></div>
        <div><dt>추첨일</dt><dd id="drawDate">—</dd></div>
      </dl>
    </div>
    <div class="rows" id="rows"></div>
    <div class="barcode" aria-hidden="true"></div>
    <div class="ticket-foot">
      <span>A~E 5게임</span>
      <span>자동선택</span>
    </div>
  </main>

  <section class="controls">
    <button type="button" id="drawAllBtn" class="draw-all">전체 자동 추첨</button>
    <p class="hint">고정(🔒)한 번호는 그대로 두고 나머지만 다시 뽑아요.</p>
    <ul class="legend" aria-label="번호대별 공 색상">
      <li><span class="dot dot--yellow"></span>1–10</li>
      <li><span class="dot dot--blue"></span>11–20</li>
      <li><span class="dot dot--red"></span>21–30</li>
      <li><span class="dot dot--gray"></span>31–40</li>
      <li><span class="dot dot--green"></span>41–45</li>
    </ul>
  </section>

  <footer class="disclaimer">
    <p>만 19세 미만 구매 불가 · 이 페이지는 재미로 번호를 뽑아보는 생성기이며, 실제 동행복권 추첨 결과·당첨과는 무관합니다.</p>
  </footer>
</div>

<script>
(function(){
  var LETTERS = ["A","B","C","D","E"];
  var STORAGE_KEY = "ball-machine-ticket-v1";
  var state = null;

  function ballClass(n){
    if(n<=10) return "ball--yellow";
    if(n<=20) return "ball--blue";
    if(n<=30) return "ball--red";
    if(n<=40) return "ball--gray";
    return "ball--green";
  }

  function secureShuffle(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){
      var r = new Uint32Array(1);
      crypto.getRandomValues(r);
      var j = r[0] % (i+1);
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function drawRow(row){
    var lockedNums = {};
    row.main.forEach(function(b){ if(b.locked) lockedNums[b.num] = true; });
    if(row.bonus.locked) lockedNums[row.bonus.num] = true;
    var pool = [];
    for(var n=1;n<=45;n++){ if(!lockedNums[n]) pool.push(n); }
    pool = secureShuffle(pool);
    var idx = 0;
    var newMain = row.main.map(function(b){
      return b.locked ? b : {num: pool[idx++], locked:false};
    });
    var newBonus = row.bonus.locked ? row.bonus : {num: pool[idx++], locked:false};
    newMain.sort(function(a,b){ return a.num - b.num; });
    return {main:newMain, bonus:newBonus};
  }

  function freshRow(){
    var blank = {
      main:[0,0,0,0,0,0].map(function(){ return {num:0, locked:false}; }),
      bonus:{num:0, locked:false}
    };
    return drawRow(blank);
  }

  function freshState(){
    var s = {};
    LETTERS.forEach(function(l){ s[l] = freshRow(); });
    return s;
  }

  function save(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  }
  function loadSaved(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return null;
      var parsed = JSON.parse(raw);
      var ok = LETTERS.every(function(l){ return parsed && parsed[l] && parsed[l].main && parsed[l].bonus; });
      return ok ? parsed : null;
    }catch(e){ return null; }
  }

  function ballHTML(letter, kind, index, b){
    var id = kind === "bonus" ? ("ball-" + letter + "-bonus") : ("ball-" + letter + "-" + index);
    var locked = b.locked;
    var label = "번호 " + b.num + (locked ? ", 고정됨. 클릭하면 고정 해제" : ". 클릭하면 고정");
    return '<button type="button" id="' + id + '" class="ball ' + ballClass(b.num) + (locked ? " is-locked" : "") +
      '" data-letter="' + letter + '" data-kind="' + kind + '" data-index="' + (kind === "bonus" ? "" : index) +
      '" aria-pressed="' + locked + '" aria-label="' + label + '">' + b.num + "</button>";
  }

  function rowHTML(letter){
    var row = state[letter];
    var balls = row.main.map(function(b,i){ return ballHTML(letter, "main", i, b); }).join("");
    var bonus = ballHTML(letter, "bonus", null, row.bonus);
    return '<div class="row" id="row-' + letter + '" data-letter="' + letter + '">' +
      '<span class="row-label">' + letter + '</span>' +
      '<div class="balls">' + balls + '<span class="plus">+</span>' + bonus + '</div>' +
      '<button type="button" class="redraw" id="redraw-' + letter + '" data-letter="' + letter + '" aria-label="' + letter + '줄 다시 추첨">↻</button>' +
      '</div>';
  }

  function render(){
    document.getElementById("rows").innerHTML = LETTERS.map(rowHTML).join("");
  }

  function animateRow(letter){
    if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var row = document.getElementById("row-" + letter);
    if(!row) return;
    var balls = row.querySelectorAll(".ball:not(.is-locked)");
    balls.forEach(function(el, i){
      el.style.animation = "none";
      void el.offsetWidth;
      setTimeout(function(){ el.style.animation = "pop .42s cubic-bezier(.34,1.56,.64,1) both"; }, i * 55);
    });
  }

  function renderMeta(){
    var FIRST_DRAW = new Date(2002, 11, 7, 20, 35, 0);
    var now = new Date();
    var diffWeeks = Math.max(0, Math.floor((now - FIRST_DRAW) / (7*86400000)));
    var round = diffWeeks + 1;
    var drawDate = new Date(FIRST_DRAW.getTime() + diffWeeks * 7 * 86400000);
    if(now.getTime() > drawDate.getTime()){
      round += 1;
      drawDate = new Date(drawDate.getTime() + 7*86400000);
    }
    document.getElementById("roundNum").textContent = "제 " + round + "회";
    document.getElementById("drawDate").textContent = drawDate.toLocaleDateString("ko-KR", {year:"numeric", month:"long", day:"numeric"}) + "(토)";
  }

  function bindEvents(){
    document.getElementById("rows").addEventListener("click", function(e){
      var ballBtn = e.target.closest(".ball");
      var redrawBtn = e.target.closest(".redraw");
      if(ballBtn){
        var letter = ballBtn.dataset.letter;
        var kind = ballBtn.dataset.kind;
        if(kind === "bonus"){
          state[letter].bonus.locked = !state[letter].bonus.locked;
        } else {
          var idx = Number(ballBtn.dataset.index);
          state[letter].main[idx].locked = !state[letter].main[idx].locked;
        }
        render();
        save();
        return;
      }
      if(redrawBtn){
        var l = redrawBtn.dataset.letter;
        state[l] = drawRow(state[l]);
        render();
        save();
        animateRow(l);
      }
    });

    document.getElementById("drawAllBtn").addEventListener("click", function(){
      LETTERS.forEach(function(letter){ state[letter] = drawRow(state[letter]); });
      render();
      save();
      LETTERS.forEach(function(letter, i){ setTimeout(function(){ animateRow(letter); }, i * 90); });
    });
  }

  function start(hotData){
    var fromHot = hotData && LETTERS.every(function(l){ return hotData[l] && hotData[l].main && hotData[l].bonus; }) ? hotData : null;
    state = fromHot || loadSaved() || freshState();
    renderMeta();
    render();
    bindEvents();
  }

  if(window.claude && window.claude.hot){
    window.claude.hot.snapshot(function(){ return state; });
  }
  if(window.claude && window.claude.hot && window.claude.hot.ready){
    window.claude.hot.ready(start);
  } else {
    start(window.claude && window.claude.hot ? window.claude.hot.data : null);
  }
})();
</script>
